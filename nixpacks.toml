# Nixpacks configuration for Railway deployment
# https://nixpacks.com/docs/configuration

[phases.setup]
nixPkgs = ['nodejs-18_x']

[phases.install]
cmds = ['npm ci']

[phases.build]
cmds = [
  'npx prisma generate',
  'npx prisma migrate deploy'
]

[start]
cmd = 'npm start'

[variables]
NODE_ENV = 'production'
